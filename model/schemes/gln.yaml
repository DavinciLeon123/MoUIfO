# yaml-language-server: $schema=../../tools/validate/schemas/scheme.schema.json
id: gln
label:
  en: Global Location Number
abbreviation: GLN
kind: identifier
issuer: gs1
jurisdiction: GLOBAL
availability:
  value: public
  source: landscape-v1-2
  certainty: likely
iso6523_icd:
  value: "0088"
  source: peppol-code-lists-9-7
  certainty: likely
peppol_eas:
  value: "0088"
  source: peppol-code-lists-9-7
  certainty: certain
sources:
  default: gs1-gln-allocation-rules
scope:
  en: "legal entities, locations, functions; mainly for EDI and e-invoicing"
notes:
  en: "not relevant for identification, but possibly for search purposes"
format:
  patterns:
    - regex: "^[0-9]{13}$"
      certainty: likely
      source: peppol-code-lists-9-7
      note: "13 digits including the check digit (Peppol Code Lists v9.7, entry 0088). The GS1 General Specifications text, which states the structure, was not read (docs/gaps.md)."
  checksum:
    - algorithm: gs1-mod10
      certainty: likely
      source: peppol-code-lists-9-7
      note: "Check Digit: mod10 (weights 1, 3), Peppol Code Lists v9.7, entry 0088. The GS1 General Specifications text was not read (docs/gaps.md)."
  examples_valid:
    - "6291041500213"
  examples_invalid:
    - "6291041500214"
level:
  - value: location
    certainty: certain
    source: gs1-nl-gln
    note: "GS1 Nederland: a GLN identifies organisations and locations worldwide and uniquely."
  - value: legal-entity
    certainty: likely
    source: gs1-gln-allocation-rules
    note: "A GLN may identify a legal entity, a function or a location (GS1 GLN Allocation Rules 3.0.2)."
mandatory:
  text: "no"
  certainty: likely
  source: landscape-v1-2
validation_source:
  label: Verified by GS1 (GS1 Nederland)
  url: "https://www.gs1.nl/producten-services/codes-verifieren/verified-by-gs1/"
  certainty: certain
  source: gs1-verified
applicability:
  - jurisdiction: GLOBAL
    status: [issued]
    certainty: certain
    source: gs1-gln-allocation-rules
