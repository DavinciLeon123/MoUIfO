# yaml-language-server: $schema=../../tools/validate/schemas/vocab-simple.schema.json
id: relation-kind
label:
  en: Relation kind
  nl: Relatiesoort
values:
  - id: derived-from
    label:
      en: Derived from
      nl: afgeleid van
    definition:
      en: "The subject identifier can be derived from the target identifier by a rule (SPEC section 5.1)."
      nl: "Het identificatienummer van het onderwerp kan met een regel worden afgeleid uit dat van het doel (SPEC §5.1)."
  - id: contains
    label:
      en: Contains
      nl: bevat
    definition:
      en: "The subject identifier contains the target identifier as a part of its own value (SPEC section 5.1)."
      nl: "Het identificatienummer van het onderwerp bevat dat van het doel als deel van zijn eigen waarde (SPEC §5.1)."
  - id: prerequisite
    label:
      en: Prerequisite
      nl: vereiste
    definition:
      en: "The subject identifier can only be obtained when the target identifier exists (SPEC section 5.1)."
      nl: "Het identificatienummer van het onderwerp kan alleen worden verkregen als dat van het doel bestaat (SPEC §5.1)."
  - id: same-level
    label:
      en: Same level
      nl: zelfde niveau
    definition:
      en: "The subject and the target identify the same level of an organisation (SPEC section 5.1)."
      nl: "Onderwerp en doel identificeren hetzelfde niveau van een organisatie (SPEC §5.1)."
  - id: different-level
    label:
      en: Different level
      nl: ander niveau
    definition:
      en: "The subject and the target identify different levels of an organisation (SPEC section 5.1)."
      nl: "Onderwerp en doel identificeren verschillende niveaus van een organisatie (SPEC §5.1)."
  - id: equivalent-in
    label:
      en: Equivalent in
      nl: equivalent in
    definition:
      en: "The subject has the same function in another country as the target (SPEC section 5.1)."
      nl: "Het onderwerp heeft in een ander land dezelfde functie als het doel (SPEC §5.1)."
  - id: may-identify-same-party
    label:
      en: May identify the same party
      nl: kan dezelfde partij identificeren
    definition:
      en: "The subject and the target may identify the same party, without a rule that proves it (SPEC section 5.1)."
      nl: "Onderwerp en doel kunnen dezelfde partij identificeren, zonder een regel die dat bewijst (SPEC §5.1)."
  - id: references
    label:
      en: References
      nl: verwijst naar
    definition:
      en: "The subject identifier refers to the target identifier (SPEC section 5.1)."
      nl: "Het identificatienummer van het onderwerp verwijst naar dat van het doel (SPEC §5.1)."
  - id: specializes
    label:
      en: Specializes
      nl: specialiseert
    definition:
      en: "The subject scheme is a narrower, national form of the target scheme, for example vat-nl of vat (DEC-034, amending SPEC section 5.1)."
      nl: "Het schema van het onderwerp is een engere, nationale vorm van het schema van het doel, bijvoorbeeld vat-nl van vat (DEC-034, ter wijziging van SPEC §5.1)."
