version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # Stay on the Node 24 typings.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Vendored tarball, not a registry dependency.
      - dependency-name: xlsx
      # Preact stays on the 10 line for v0.1 (Phase 7 RESEARCH Pitfall 7).
      - dependency-name: preact
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
